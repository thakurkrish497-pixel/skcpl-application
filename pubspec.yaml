name: skcpl_app
description: SKCPL Construction Management — Stock Inventory & Cash Book
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Backend
  supabase_flutter: ^2.3.0
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Navigation
  go_router: ^13.1.0
  
  # UI & Design
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  iconsax: ^0.0.8
  shimmer: ^3.0.0
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.3
  crypto: ^3.0.3
  image_picker: ^1.2.1
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0

  # Audio & Media
  record: ^5.1.2
  record_web: ^1.3.0
  audioplayers: ^6.0.0
  http: ^1.2.0

  # PDF
  pdf: ^3.11.0
  printing: ^5.13.1
  path_provider: ^2.1.3
  excel: ^4.0.6
  share_plus: ^13.3.1
  open_filex: ^5.0.0
  geolocator: ^14.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.7

dependency_overrides:
  record_platform_interface: 1.2.0
  record_linux: 0.7.2
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
