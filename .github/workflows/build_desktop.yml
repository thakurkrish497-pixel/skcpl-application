name: Build SKCPL Desktop (Windows & macOS)

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'windows/**'
      - 'macos/**'
      - 'pubspec.yaml'

jobs:
  # ==========================================
  # 1. BUILD WINDOWS DESKTOP (.exe)
  # ==========================================
  build-windows:
    name: Build Windows Desktop Application
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release Executable
        run: flutter build windows --release

      - name: Compress Windows Release Bundle
        shell: pwsh
        run: |
          $releaseDir = Get-ChildItem -Path build/windows -Recurse -Directory | Where-Object { $_.FullName -like "*runner*Release" } | Select-Object -First 1
          if (-not $releaseDir) {
            $releaseDir = Get-ChildItem -Path build/windows -Recurse -Directory | Where-Object { $_.Name -eq "Release" } | Select-Object -Last 1
          }
          Write-Host "Found release directory: $($releaseDir.FullName)"
          Compress-Archive -Path "$($releaseDir.FullName)/*" -DestinationPath SKCPL-Windows-x64.zip

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SKCPL-Windows-x64
          path: SKCPL-Windows-x64.zip

  # ==========================================
  # 2. BUILD MACOS DESKTOP (.app)
  # ==========================================
  build-macos:
    name: Build macOS Desktop Application
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Release App
        run: flutter build macos --release

      - name: Compress macOS Release App
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y "${{ github.workspace }}/SKCPL-macOS.zip" *.app

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SKCPL-macOS
          path: SKCPL-macOS.zip

  # ==========================================
  # 3. PUBLISH PUBLIC RELEASE (FOR WEBSITE DOWNLOADS)
  # ==========================================
  publish-release:
    name: Publish Public Download Links
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: List Release Files
        run: ls -la release-files

      - name: Create or Update Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "SKCPL Operations ERP v1.0.0 (Connect to Waves)"
          body: |
            ## SKCPL Operations & Construction ERP — Connect to Waves
            **Developer**: Krish Thakur
            **Publisher**: S. Kumar Creation Pvt. Ltd. (Indore, MP, India)

            ### Direct Website Downloads:
            - **Windows (64-bit)**: [SKCPL-Windows-x64.zip](https://github.com/thakurkrish497-pixel/skcpl-application/releases/download/v1.0.0/SKCPL-Windows-x64.zip)
            - **macOS Desktop**: [SKCPL-macOS.zip](https://github.com/thakurkrish497-pixel/skcpl-application/releases/download/v1.0.0/SKCPL-macOS.zip)
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

